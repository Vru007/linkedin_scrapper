<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LinkedIn Profile API</title>
<style>
  :root { --bg:#0b1220; --card:#141c2e; --line:#26324a; --txt:#e6ecf5; --muted:#93a1bd; --accent:#3b82f6; --err:#ef4444; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--txt); }
  .wrap { max-width:820px; margin:0 auto; padding:24px 16px 60px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  .row { display:flex; gap:8px; }
  input, textarea { width:100%; background:#0f1728; border:1px solid var(--line); color:var(--txt);
    border-radius:8px; padding:10px 12px; font-size:14px; font-family:inherit; }
  textarea { resize:vertical; min-height:64px; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:10px 16px;
    font-size:14px; cursor:pointer; white-space:nowrap; }
  button.ghost { background:transparent; color:var(--muted); border:1px solid var(--line); }
  label { display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; }
  .banner { border-radius:8px; padding:10px 12px; font-size:13px; margin-bottom:12px; display:none; }
  .banner.err { background:rgba(239,68,68,.12); border:1px solid var(--err); color:#fca5a5; }
  pre { background:#0f1728; border:1px solid var(--line); border-radius:8px; padding:14px;
    overflow:auto; font-size:12.5px; line-height:1.5; max-height:560px; }
  .muted { color:var(--muted); font-size:12px; }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>LinkedIn Profile API</h1>
  <div class="sub">Paste a LinkedIn profile URL and get structured JSON.</div>

  <div id="banner" class="banner err"></div>

  <div class="card">
    <div class="row">
      <input id="url" placeholder="https://www.linkedin.com/in/<slug>/" />
      <button id="go">Fetch</button>
    </div>
    <div style="margin-top:10px">
      <button id="toggleSettings" class="ghost">⚙ Settings (tokens)</button>
    </div>

    <div id="settings" class="hidden" style="margin-top:12px; border-top:1px solid var(--line); padding-top:12px">
      <div class="muted">Stored only in your browser and sent per request. Update these when the session expires.</div>
      <label>li_at</label>
      <textarea id="liat" placeholder="AQED..."></textarea>
      <label>JSESSIONID</label>
      <input id="jsess" placeholder="ajax:1234567890" />
      <label>API key (optional — only if the server enforces one)</label>
      <input id="apikey" placeholder="leave blank if not required" />
      <div style="margin-top:10px"><button id="save">Save tokens</button></div>
    </div>
  </div>

  <div id="resultCard" class="card hidden">
    <div class="row" style="justify-content:space-between; align-items:center">
      <div class="muted" id="status"></div>
      <button id="copy" class="ghost">Copy JSON</button>
    </div>
    <pre id="out"></pre>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const LS = { liat:'li_at', jsess:'jsessionid', apikey:'apikey' };

// load saved tokens
$('liat').value   = localStorage.getItem(LS.liat)   || '';
$('jsess').value  = localStorage.getItem(LS.jsess)  || '';
$('apikey').value = localStorage.getItem(LS.apikey) || '';

$('toggleSettings').onclick = () => $('settings').classList.toggle('hidden');
$('save').onclick = () => {
  localStorage.setItem(LS.liat,  $('liat').value.trim());
  localStorage.setItem(LS.jsess, $('jsess').value.trim());
  localStorage.setItem(LS.apikey,$('apikey').value.trim());
  showBanner('Tokens saved.', false);
};

function showBanner(msg, isError=true) {
  const b = $('banner');
  b.textContent = msg;
  b.className = 'banner ' + (isError ? 'err' : '');
  b.style.display = 'block';
  b.style.color = isError ? '' : '#86efac';
}

async function fetchProfile() {
  const url = $('url').value.trim();
  $('banner').style.display = 'none';
  if (!url) return showBanner('Enter a LinkedIn profile URL.');

  const headers = {};
  const liat = localStorage.getItem(LS.liat), jsess = localStorage.getItem(LS.jsess), key = localStorage.getItem(LS.apikey);
  if (liat && jsess) { headers['x-li-at'] = liat; headers['x-jsessionid'] = jsess; }
  if (key) headers['x-api-key'] = key;

  $('status').textContent = 'Fetching…';
  $('resultCard').classList.remove('hidden');
  $('out').textContent = '';
  try {
    const res = await fetch('/api/v1/profile?url=' + encodeURIComponent(url), { headers });
    const data = await res.json();
    $('status').textContent = 'HTTP ' + res.status;
    $('out').textContent = JSON.stringify(data, null, 2);
    if (res.status === 502) {
      showBanner('Session expired or blocked. Open Settings and paste a fresh li_at token.');
      $('settings').classList.remove('hidden');
    } else if (!res.ok) {
      showBanner(data.detail || ('Request failed (HTTP ' + res.status + ').'));
    }
  } catch (e) {
    $('status').textContent = 'Error';
    showBanner('Network error: ' + e.message);
  }
}

$('go').onclick = fetchProfile;
$('url').addEventListener('keydown', e => { if (e.key === 'Enter') fetchProfile(); });
$('copy').onclick = () => navigator.clipboard.writeText($('out').textContent);
</script>
</body>
</html>
